<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
<!-- 红河同路 · 石榴（可交互）
  每瓣 = 一站：chamber-yisa / chamber-forest / chamber-oldtown / chamber-samaba
  每瓣 5 颗等大命名籽 = 红河县世居五族：seed-{站}-{han|hani|yi|dai|yao}，其余小籽 = 生活在红河的其他各族群众
  状态类名：.chamber.is-locked（未打卡）/ .chamber.is-lit（已打卡）；.seed.is-pending（内容整理中）/ .seed.is-done（已学完）/ .seed.is-active（放大中）
-->
<defs>
  <radialGradient id="ruby" cx="35%" cy="30%" r="75%">
    <stop offset="0" stop-color="#E2626A"/>
    <stop offset="0.55" stop-color="#B8323A"/>
    <stop offset="1" stop-color="#7E1F27"/>
  </radialGradient>
  <style>
    .rind{fill:#A8452F}
    .rind-inner{fill:#F6EBDC}
    .membrane{stroke:#E9D6BC;stroke-width:8;stroke-linecap:round;fill:none}
    .contour{stroke:#D9A441;stroke-width:1.4;fill:none;opacity:.55}
    .seed{fill:url(#ruby);stroke:#fff;stroke-opacity:.35;stroke-width:1;transition:transform .3s ease-out,opacity .3s}
    .chamber.is-locked .seed{fill:#E4D6C3;stroke:#D2C1AA}
    .seed.is-pending{fill-opacity:.45;stroke-dasharray:3 2;stroke:#fff;stroke-opacity:.9}
    .seed.is-done{stroke:#D9A441;stroke-width:2.5;stroke-opacity:1}
    .seed.is-active{stroke:#D9A441;stroke-width:3;stroke-opacity:1}
  </style>
</defs>
<path class="rind" d="M176 70 L168 40 L186 54 L200 30 L214 54 L232 40 L224 70 Z"/>
<circle class="rind" cx="200" cy="230" r="179"/>
<circle class="rind-inner" cx="200" cy="230" r="165"/>
<path class="membrane" d="M200 71 Q206 230 200 389"/>
